<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-label="Lyna's pink and purple cybersecurity themed terminal">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07000f"/>
      <stop offset="55%" stop-color="#11001d"/>
      <stop offset="100%" stop-color="#050008"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="55%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#ff5bd8"/>
    </linearGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .mono {
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      }
      .cmd { fill:#ff75dc; font-size:14px; }
      .out { fill:#c69cff; font-size:14px; }
      .white { fill:#f7eaff; font-size:14px; }
      .muted { fill:#9f7ab8; font-size:12px; }
      .title { fill:#f7eaff; font-size:15px; font-weight:700; }
      .cursor { animation: blink 1s steps(1,end) infinite; }
      .float { animation: float 4s ease-in-out infinite; transform-box: fill-box; transform-origin:center; }
      .pulse { animation: pulse 2.5s ease-in-out infinite; }
      .twinkle { animation: twinkle 2s ease-in-out infinite; }
      @keyframes blink { 0%,45%{opacity:1} 46%,100%{opacity:0} }
      @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
      @keyframes pulse { 0%,100%{opacity:.45} 50%{opacity:1} }
      @keyframes twinkle { 0%,100%{opacity:.25} 50%{opacity:1} }
    </style>
  </defs>

  <!-- Background -->
  <rect x="3" y="3" width="894" height="514" rx="20" fill="url(#bg)" stroke="url(#accent)" stroke-width="2" filter="url(#glow)"/>

  <!-- Terminal header -->
  <rect x="4" y="4" width="892" height="52" rx="19" fill="#0a0012"/>
  <line x1="4" y1="56" x2="896" y2="56" stroke="#6821a8" stroke-width="1"/>

  <circle cx="31" cy="30" r="8" fill="#ff5bd8"/>
  <circle cx="56" cy="30" r="8" fill="#d36bff"/>
  <circle cx="81" cy="30" r="8" fill="#8b5cf6"/>

  <text x="366" y="36" class="mono title">♥  lyna@github: ~</text>
  <text x="720" y="35" class="mono" font-size="12" fill="#e879f9">good things take time ♡</text>

  <!-- Left terminal -->
  <text x="28" y="84" class="mono cmd">lyna@github:~$ whoami</text>
  <text x="28" y="105" class="mono white">lyna</text>

  <text x="28" y="137" class="mono cmd">lyna@github:~$ cat about.txt</text>
  <text x="28" y="158" class="mono out">Computer Science Student</text>
  <text x="28" y="179" class="mono out">building with code, learning by doing ♥</text>

  <text x="28" y="211" class="mono cmd">lyna@github:~$ cat interests.txt</text>
  <text x="28" y="233" class="mono out">&gt; Cybersecurity</text>
  <text x="28" y="254" class="mono out">&gt; SCADA / ICS Security</text>
  <text x="28" y="275" class="mono out">&gt; Artificial Intelligence / LLMs</text>
  <text x="28" y="296" class="mono out">&gt; Full-Stack Development</text>
  <text x="28" y="317" class="mono out">&gt; Networking &amp; Linux</text>

  <text x="28" y="350" class="mono cmd">lyna@github:~$ ls ~/projects</text>
  <text x="28" y="373" class="mono out">LITAN-LLM/</text>
  <text x="148" y="373" class="mono out">ComandBase/</text>
  <text x="272" y="373" class="mono out">DZ-Fit/</text>

  <text x="28" y="395" class="mono out">E-commerce/</text>
  <text x="148" y="395" class="mono out">Network-Labs/</text>
  <text x="272" y="395" class="mono out">Security-Labs/</text>

  <text x="28" y="430" class="mono cmd">lyna@github:~$ git status</text>
  <text x="28" y="452" class="mono out">On branch main</text>
  <text x="28" y="473" class="mono cmd">Your workspace is clean. ♥</text>
  <text x="28" y="501" class="mono cmd">lyna@github:~$</text>
  <rect x="149" y="488" width="9" height="16" rx="1" fill="#ff75dc" class="cursor"/>

  <!-- Cute terminal cat -->
  <g class="float" transform="translate(360 75)" fill="none" stroke="#ff75dc" stroke-width="2">
    <path d="M14 35 L23 8 L42 20 Q62 11 82 20 L101 8 L106 37 Q109 67 60 70 Q11 67 14 35Z"/>
    <circle cx="44" cy="38" r="2" fill="#ff75dc"/>
    <circle cx="76" cy="38" r="2" fill="#ff75dc"/>
    <path d="M57 47 Q60 52 63 47"/>
    <path d="M60 52 Q53 58 47 53"/>
    <path d="M60 52 Q67 58 73 53"/>
  </g>

  <g class="twinkle" fill="#ff75dc">
    <text x="350" y="72" font-size="16">✦</text>
    <text x="463" y="91" font-size="12">✦</text>
    <text x="505" y="135" font-size="13">+</text>
    <text x="330" y="145" font-size="11">+</text>
  </g>

  <!-- Right: projects -->
  <rect x="510" y="165" width="365" height="165" rx="13" fill="#0c0017" stroke="#7626b5" stroke-width="1.5"/>
  <text x="530" y="193" class="mono title">✦  Featured Projects</text>
  <line x1="525" y1="204" x2="860" y2="204" stroke="#4e1779"/>

  <text x="530" y="230" class="mono cmd">LITAN-LLM</text>
  <text x="530" y="248" class="mono muted">LLM interaction tracking &amp; experimentation</text>

  <text x="530" y="274" class="mono cmd">ComandBase</text>
  <text x="530" y="292" class="mono muted">Cybersecurity commands &amp; tools knowledge base</text>

  <text x="530" y="318" class="mono cmd">E-commerce Platform</text>
  <text x="530" y="326" class="mono muted" font-size="10">Full-featured freelance store • Email • EcoTrack</text>

  <!-- Right: status -->
  <rect x="510" y="345" width="365" height="125" rx="13" fill="#0c0017" stroke="#7626b5" stroke-width="1.5"/>
  <text x="530" y="373" class="mono title">⌁  Currently...</text>
  <line x1="525" y1="384" x2="860" y2="384" stroke="#4e1779"/>

  <text x="530" y="409" class="mono out">◯ learning cybersecurity</text>
  <text x="530" y="430" class="mono out">◯ exploring SCADA / ICS security</text>
  <text x="530" y="451" class="mono out">◯ building real-world projects</text>

  <!-- Decorative moon -->
  <g class="pulse">
    <circle cx="830" cy="92" r="22" fill="#d879ff"/>
    <circle cx="840" cy="84" r="22" fill="#10001b"/>
  </g>

  <!-- Footer -->
  <line x1="20" y1="506" x2="880" y2="506" stroke="#6821a8"/>
  <text x="28" y="516" class="mono muted">♥ Lyna Selmani</text>
  <text x="692" y="516" class="mono muted">CS • Cybersecurity • AI • SCADA/ICS</text>

</svg>
