<svg width="900" height="520" viewBox="0 0 900 520"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07000f"/>
      <stop offset="50%" stop-color="#11001d"/>
      <stop offset="100%" stop-color="#050008"/>
    </linearGradient>

    <!-- Pink / purple gradient -->
    <linearGradient id="pinkPurple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b85cff"/>
      <stop offset="50%" stop-color="#ff4fd8"/>
      <stop offset="100%" stop-color="#ff8ce8"/>
    </linearGradient>

    <!-- Progress gradient -->
    <linearGradient id="progress" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ff5bd8"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="smallGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Blinking cursor -->
    <style>
      .terminal {
        font-family: monospace;
        font-size: 15px;
      }

      .title {
        font-family: monospace;
        font-size: 16px;
        font-weight: bold;
      }

      .text {
        font-family: monospace;
        font-size: 13px;
      }

      .purple {
        fill: #c084fc;
      }

      .pink {
        fill: #ff72dc;
      }

      .white {
        fill: #f7eaff;
      }

      .muted {
        fill: #9d7bb5;
      }

      .cursor {
        animation: blink 1s infinite;
      }

      .pulse {
        animation: pulse 2s infinite ease-in-out;
      }

      .float {
        animation: float 4s infinite ease-in-out;
      }

      @keyframes blink {
        0%, 45% { opacity: 1; }
        46%, 100% { opacity: 0; }
      }

      @keyframes pulse {
        0%, 100% { opacity: .55; }
        50% { opacity: 1; }
      }

      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
      }
    </style>

  </defs>


  <!-- ================= BACKGROUND ================= -->

  <rect width="900" height="520" rx="22" fill="url(#bg)"/>

  <!-- Outer glow -->
  <rect x="4" y="4" width="892" height="512"
        rx="20"
        fill="none"
        stroke="url(#pinkPurple)"
        stroke-width="2"
        filter="url(#glow)"/>

